<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="171" cy="508" r="79" fill="#047857" opacity="0.18"/>
    <circle cx="269" cy="611" r="38" fill="#047857" opacity="0.18"/>
    <circle cx="1266" cy="-56" r="47" fill="#047857" opacity="0.14"/>
    <circle cx="687" cy="258" r="32" fill="#047857" opacity="0.16"/>
    <circle cx="1119" cy="663" r="80" fill="#047857" opacity="0.09"/>
    <circle cx="928" cy="462" r="59" fill="#047857" opacity="0.13"/>
    <rect x="832" y="610" width="29" height="41" rx="8" fill="#059669" opacity="0.13" transform="rotate(20, 320, 636)"/>
    <rect x="734" y="88" width="43" height="34" rx="8" fill="#059669" opacity="0.13" transform="rotate(40, 234, 310)"/>
    <rect x="909" y="232" width="71" height="87" rx="8" fill="#059669" opacity="0.13" transform="rotate(40, 1210, -28)"/>
    <rect x="-31" y="643" width="72" height="21" rx="8" fill="#059669" opacity="0.10" transform="rotate(3, 989, 278)"/>
    <rect x="627" y="563" width="80" height="46" rx="8" fill="#059669" opacity="0.10" transform="rotate(28, 432, 469)"/>
    <rect x="224" y="193" width="41" height="27" rx="8" fill="#059669" opacity="0.06" transform="rotate(5, 832, 26)"/>
    <rect x="808" y="286" width="69" height="91" rx="8" fill="#059669" opacity="0.12" transform="rotate(27, -90, 717)"/>
    <rect x="1022" y="-56" width="55" height="78" rx="8" fill="#059669" opacity="0.04" transform="rotate(12, 871, 116)"/>
    <polygon points="865,331 900,401 830,401" fill="#047857" opacity="0.07"/>
    <polygon points="155,-139 219,-11 91,-11" fill="#047857" opacity="0.04"/>
    <polygon points="206,525 229,571 183,571" fill="#047857" opacity="0.06"/>
    <polygon points="869,-139 923,-31 815,-31" fill="#047857" opacity="0.10"/>

  <!-- Wave at bottom -->
  <path d="M0,570 C360,600 840,540 1200,570 L1200,630 L0,630Z" fill="#047857" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    Osaka castle 안내
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    Osaka — 정보
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#34d399" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#34d399" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    Osaka Osaka castle 안내 — 정보
  </text>
</svg>